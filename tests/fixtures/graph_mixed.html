<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>@graph mixed</title>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebSite",
        "name": "North Shore Ledger",
        "url": "https://ledger.example"
      },
      {
        "@type": ["Course", "Product"],
        "name": "Payroll Lab",
        "about": "Hands-on payroll workshop",
        "author": "Ada Book",
        "url": "https://ledger.example/payroll",
        "offers": { "@type": "Offer", "price": "249", "priceCurrency": "CAD" },
        "hasCourseInstance": {
          "@type": "CourseInstance",
          "startDate": "2026-10-01",
          "endDate": "2026-10-04",
          "courseMode": "onsite"
        }
      },
      {
        "@type": "BreadcrumbList",
        "itemListElement": [
          { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://ledger.example/" },
          { "@type": "ListItem", "position": 2, "name": "Courses", "item": "https://ledger.example/courses" }
        ]
      }
    ]
  }
  </script>
</head>
<body><h1>Graph</h1></body>
</html>
