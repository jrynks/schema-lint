<!doctype html>
<html lang="en">
<head>

  <title>Valid FAQPage</title>

    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {
        "@type": "Question",
        "name": "What is a course refund policy?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Refunds are issued within 14 days of purchase."

      },
      {
        "@type": "Question",
        "name": "Do you offer evening classes?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes, Tuesday and Thursday evenings."
        }
      }
    ]
  }
  </script>
</head>

</html>
