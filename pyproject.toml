[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "schema-lint"
version = "1.0.0"
description = "Local Linux CLI for agent Site Audit: fetch pages, extract JSON-LD, validate Course / LocalBusiness / FAQPage."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jason Ng" }]
keywords = ["schema.org", "json-ld", "seo", "rich-results", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Environment :: Console",
  "Topic :: Internet :: WWW/HTTP",
  "License :: OSI Approved :: MIT License",
]
dependencies = []

[project.optional-dependencies]
html = ["beautifulsoup4>=4.12", "lxml>=5.0"]
dev = ["beautifulsoup4>=4.12"]

[project.scripts]
schema-lint = "schema_lint.cli:main"

[tool.setuptools.packages.find]
include = ["schema_lint*"]
